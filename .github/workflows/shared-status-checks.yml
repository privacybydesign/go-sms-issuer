# Canary for the shared workflows (privacybydesign/github-workflows@main),
# running next to the current status-checks.yml. Only on PRs and manual runs;
# this file is removed again once the migration replaces status-checks.yml.
name: Shared status checks (canary)

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  frontend:
    uses: privacybydesign/github-workflows/.github/workflows/node-checks.yml@main
    permissions:
      contents: read
    with:
      working-directory: frontend
      scripts: build
      ignore-scripts: true

  go:
    uses: privacybydesign/github-workflows/.github/workflows/go-checks.yml@main
    permissions:
      contents: read
    with:
      working-directory: backend
      test-dockerfile: Dockerfile.test
      coverage-file: /coverage/coverage.out # Dockerfile.test writes here
      codecov: true
      codecov-flags: backend
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker:
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      push-image: false
    secrets:
      # Public Cloudflare Turnstile site key, baked into the frontend bundle.
      DOCKER_BUILD_ARGS: TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}

  codeql:
    uses: privacybydesign/github-workflows/.github/workflows/codeql.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      languages: '["go", "javascript-typescript", "actions"]'
      go-version-file: backend/go.mod
      go-build-command: cd backend && go build ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@main
    permissions:
      contents: read
    with:
      # Only the canary files: the current workflows are replaced at migration.
      paths: .github/workflows/shared-status-checks.yml .github/workflows/shared-image-rescan.yml

  passed:
    name: Status checks passed
    if: always()
    needs: [frontend, go, docker, codeql, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
