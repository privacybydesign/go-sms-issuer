# Weekly re-scan of the PUBLISHED images (all platforms) for new CVEs.
name: Image rescan

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  rescan:
    uses: privacybydesign/github-workflows/.github/workflows/image-rescan.yml@b6d889469f600554685deaa6ea9105a289c447fb # main
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      tags: edge latest-release
      severity-cutoff: high
