# Delivery: builds, scans and pushes ghcr.io/privacybydesign/go-sms-issuer.
# Push to main -> :edge, release -> :x.y.z. PR builds are scanned in Status
# checks; published images are re-scanned weekly by image-rescan.yml.
name: Delivery

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@rhensen/yiv-401-moving-v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    secrets:
      # Public Cloudflare Turnstile site key, baked into the frontend bundle.
      DOCKER_BUILD_ARGS: TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
